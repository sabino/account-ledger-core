name: ledger-lab
x-delivery: &delivery
  DELIVERY_SECRET: local-delivery-secret-not-for-production
  DELIVERY_URLS: http://api-a:8080/internal/notifications,http://api-b:8080/internal/notifications
x-app: &app
  build: ./service
  image: ledger-lab:local
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 128m
  memswap_limit: 128m
  cpus: 0.25
  pids_limit: 64
  restart: unless-stopped
  logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
  depends_on:
    migrate: {condition: service_completed_successfully}
  healthcheck:
    test: [CMD, /ledger, health]
    interval: 10s
    timeout: 3s
    retries: 5
services:
  watch-setup:
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    environment: {PGPASSWORD: local-owner-only}
    volumes: ["./deploy/local/watch-role.sql:/watch-role.sql:ro"]
    command: [psql, -v, ON_ERROR_STOP=1, -h, postgres, -U, ledger_owner, -d, ledger, -f, /watch-role.sql]
    depends_on: {migrate: {condition: service_completed_successfully}}
    mem_limit: 64m
    cpus: 0.1
    restart: "no"
  watchdog:
    <<: *app
    command: [watch]
    environment:
      DATABASE_URL: "postgres://ledger_watch:local-watch-only@postgres:5432/ledger?sslmode=disable"
      INSTANCE_ID: host-watchdog
      WATCH_PROC_DIR: /hostproc
      WATCH_DISK_PATH: /watched-disk
      GOMEMLIMIT: 24MiB
    volumes:
      - /proc/meminfo:/hostproc/meminfo:ro
      - /proc/vmstat:/hostproc/vmstat:ro
      - /proc/pressure/memory:/hostproc/pressure/memory:ro
      - /proc/pressure/io:/hostproc/pressure/io:ro
      - pgdata:/watched-disk:ro
    depends_on: {watch-setup: {condition: service_completed_successfully}}
    mem_limit: 48m
    memswap_limit: 48m
    cpus: 0.05
    healthcheck: {disable: true}
  lake:
    image: chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    profiles: [lake]
    command: [mini, -dir=/data, -ip=lake, -ip.bind=0.0.0.0, -s3.config=/config/s3.json, -tableBucket=ledger-lake, -admin.ui=false, -webdav=false, -s3.port.lance=0, -master.volumeSizeLimitMB=64]
    # Soft Go runtime limit leaves room below the hard container cap for mappings and native memory.
    environment: {GOMEMLIMIT: 192MiB}
    volumes: ["lake-data:/data", "./deploy/local/lake/s3.json:/config/s3.json:ro"]
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.25
    pids_limit: 64
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 3s
      retries: 15
  cdc-setup:
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    profiles: [lake]
    environment: {PGPASSWORD: local-owner-only}
    volumes: ["./deploy/local/lake/cdc.sql:/bootstrap.sql:ro"]
    command: [psql, -v, ON_ERROR_STOP=1, -h, postgres, -U, ledger_owner, -d, ledger, -f, /bootstrap.sql]
    depends_on: {migrate: {condition: service_completed_successfully}}
    mem_limit: 64m
    cpus: 0.1
    restart: "no"
  cdc:
    # The upstream release index referenced a missing manifest; this inspected
    # upstream build is pinned by digest, never followed through a mutable tag.
    image: ghcr.io/memiiso/debezium-server-iceberg@sha256:c49ebdaae01762a5509804926710d6a831e45d56f70ce98cf69bac57cc6a6bf9
    profiles: [lake]
    environment:
      JAVA_OPTS: "-Xms64m -Xmx384m -XX:MaxDirectMemorySize=96m -XX:ActiveProcessorCount=2"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ledger-local
      AWS_SECRET_ACCESS_KEY: local-lake-only
    volumes: ["./deploy/local/lake/application.properties:/debezium/config/application.properties:ro", "cdc-data:/debezium/data"]
    depends_on: {cdc-setup: {condition: service_completed_successfully}, lake: {condition: service_healthy}}
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.5
    pids_limit: 160
    # The connector can exit 0 after a fatal sink error. Restart that case too;
    # an explicit operator stop must still remain stopped.
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
  clickhouse:
    image: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    profiles: [lake]
    environment: {CLICKHOUSE_USER: ledger_owner, CLICKHOUSE_PASSWORD: local-analytics-only, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/local/lake/clickhouse.xml:/etc/clickhouse-server/config.d/ledger.xml:ro
      - ./deploy/local/lake/clickhouse-users.xml:/etc/clickhouse-server/users.d/ledger.xml:ro
      - ./deploy/local/lake/catalog.sql:/docker-entrypoint-initdb.d/01-catalog.sql:ro
    depends_on: {lake: {condition: service_healthy}}
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 0.75
    pids_limit: 180
    restart: "on-failure:3"
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
    healthcheck:
      test: [CMD-SHELL, "clickhouse-client --user ledger_owner --password local-analytics-only --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 15
  test-runner:
    image: golang:1.27.1-bookworm@sha256:648f440f42a0958804efb24df176f806f9d353b41f1c0627f666428e40310f6b
    profiles: [test]
    user: "1000:1000"
    working_dir: /src
    volumes: ["./service:/src"]
    environment:
      GOCACHE: /tmp/go-cache
      GOPATH: /tmp/go
      TEST_DATABASE_URL: "postgres://ledger_owner:local-owner-only@postgres:5432/ledger?sslmode=disable"
      TEST_APP_DATABASE_URL: "postgres://ledger_app:local-demo-only@postgres:5432/ledger?sslmode=disable"
    command: [go, test, -race, -tags, integration, ./internal/store, -count=1, -v]
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 2g
    cpus: 2
  postgres:
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    environment: {POSTGRES_DB: ledger, POSTGRES_USER: ledger_owner, POSTGRES_PASSWORD: local-owner-only}
    command: [postgres, -c, shared_buffers=96MB, -c, work_mem=2MB, -c, max_connections=30, -c, wal_level=logical, -c, max_replication_slots=2, -c, max_wal_senders=3, -c, max_slot_wal_keep_size=512MB, -c, max_wal_size=1GB]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/local/init.sql:/docker-entrypoint-initdb.d/01-role.sql:ro
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 100
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
    healthcheck: {test: [CMD-SHELL, "pg_isready -U ledger_owner -d ledger"], interval: 3s, timeout: 3s, retries: 20}
  migrate:
    <<: *app
    command: [migrate]
    environment: {DATABASE_URL: "postgres://ledger_owner:local-owner-only@postgres:5432/ledger?sslmode=disable", INSTANCE_ID: bootstrap}
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"
    healthcheck: {disable: true}
  api-a:
    <<: *app
    environment: {<<: *delivery, DATABASE_URL: "postgres://ledger_app:local-demo-only@postgres:5432/ledger?sslmode=disable", INSTANCE_ID: replica-a, GOMEMLIMIT: 80MiB}
  api-b:
    <<: *app
    environment: {<<: *delivery, DATABASE_URL: "postgres://ledger_app:local-demo-only@postgres:5432/ledger?sslmode=disable", INSTANCE_ID: replica-b, GOMEMLIMIT: 80MiB}
  proxy:
    image: nginx:1.28.2-alpine@sha256:5b4900b042ccfa8b0a73df622c3a60f2322faeb2be800cbee5aa7b44d241649e
    ports: ["127.0.0.1:${LEDGER_HTTP_PORT:-8088}:8080"]
    volumes: ["./deploy/local/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: {api-a: {condition: service_healthy}, api-b: {condition: service_healthy}}
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.1
    pids_limit: 32
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
volumes:
  pgdata:
  lake-data:
  cdc-data:
  clickhouse-data:
