events { worker_connections 128; }
http {
 access_log off;
 limit_req_zone $binary_remote_addr zone=reads:1m rate=5r/s;
 upstream ledger { server api-a:8080; server api-b:8080; keepalive 4; }
 server {
  listen 8080;
  client_max_body_size 4k;
  location /internal/ { return 404; }
  location / { limit_req zone=reads burst=20 nodelay; proxy_pass http://ledger; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_read_timeout 10s; }
 }
}
