# Local-only credentials. Production uses separate secrets and scoped identities.
debezium.sink.type=iceberg
debezium.sink.iceberg.type=rest
debezium.sink.iceberg.uri=http://lake:8181
debezium.sink.iceberg.warehouse=s3://ledger-lake
debezium.sink.iceberg.credential=ledger-local:local-lake-only
debezium.sink.iceberg.oauth2-server-uri=http://lake:8181/v1/oauth/tokens
debezium.sink.iceberg.table-namespace=ledger
debezium.sink.iceberg.catalog-name=ledger
debezium.sink.iceberg.io-impl=org.apache.iceberg.aws.s3.S3FileIO
debezium.sink.iceberg.s3.endpoint=http://lake:8333
debezium.sink.iceberg.s3.path-style-access=true
debezium.sink.iceberg.s3.access-key-id=ledger-local
debezium.sink.iceberg.s3.secret-access-key=local-lake-only
debezium.sink.iceberg.upsert=false
debezium.sink.iceberg.format-version=2
debezium.sink.iceberg.write.format.default=parquet
debezium.sink.iceberg.write.parquet.compression-codec=zstd
debezium.sink.iceberg.write.metadata.delete-after-commit.enabled=true
debezium.sink.iceberg.write.metadata.previous-versions-max=10
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=ledger_cdc
debezium.source.database.password=local-cdc-only
debezium.source.database.dbname=ledger
debezium.source.topic.prefix=ledger
debezium.source.table.include.list=public.journal_batches
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=ledger_lake
debezium.source.publication.name=ledger_batches
debezium.source.publication.autocreate.mode=disabled
debezium.source.snapshot.mode=initial
debezium.source.max.batch.size=512
debezium.source.max.queue.size=2048
debezium.source.offset.flush.interval.ms=5000
debezium.source.offset.storage=io.debezium.server.iceberg.offset.IcebergOffsetBackingStore
debezium.source.offset.storage.iceberg.table-name=ledger_offsets
debezium.source.schema.history.internal=io.debezium.server.iceberg.history.IcebergSchemaHistory
debezium.source.schema.history.internal.iceberg.table-name=ledger_history
debezium.format.value.schemas.enable=true
debezium.format.key.schemas.enable=true
debezium.format.value=connect
debezium.format.key=connect
debezium.transforms=unwrap
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
debezium.transforms.unwrap.add.fields=op,source.lsn
debezium.sink.batch.batch-size-wait=MaxBatchSizeWait
debezium.sink.batch.batch-size-wait.max-wait-ms=30000
debezium.sink.batch.batch-size-wait.wait-interval-ms=1000
quarkus.log.level=INFO
quarkus.log.console.json=false
