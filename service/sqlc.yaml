version: "2"
sql:
  - engine: postgresql
    schema: [internal/store/migrations, sqlc/catalog.sql]
    queries: queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: pg_catalog.timestamptz
            go_type: {import: time, type: Time}
